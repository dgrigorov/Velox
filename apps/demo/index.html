<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velox Widgets — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- ── Top bar ──────────────────────────────────────────────────────── -->
  <header id="topbar">
    <div class="topbar-left">
      <div class="logo">
        <div class="logo-mark">V</div>
        <div class="logo-text">
          <span class="logo-name">Velox</span>
          <span class="logo-sub">Widget Suite</span>
        </div>
      </div>
    </div>

    <nav id="tab-nav">
      <button class="tab-btn active" data-widget="economic-calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        Economic Calendar
      </button>
      <button class="tab-btn" data-widget="market-buzz">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        Market Buzz
      </button>
    </nav>

    <div class="topbar-right">
      <button id="theme-toggle" title="Toggle theme">
        <svg id="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Widget viewport ──────────────────────────────────────────────── -->
  <main id="widget-viewport">
    <economic-calendar
      id="ec-widget"
      api-url="http://localhost:4000"
      api-key="vx_dev_demo"
      theme="dark"
    ></economic-calendar>

    <market-buzz
      id="mb-widget"
      api-url="http://localhost:4000"
      api-key="vx_dev_demo"
      theme="dark"
      style="display:none"
    ></market-buzz>
  </main>

  <!-- ── Config panel ─────────────────────────────────────────────────── -->
  <div id="config-panel" class="collapsed">
    <button id="config-toggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Configure
      <svg id="config-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    </button>
    <div id="config-body">
      <div class="config-grid">
        <div class="config-field">
          <label for="input-api-url">API URL</label>
          <input id="input-api-url" type="text" value="http://localhost:4000" placeholder="http://localhost:4000" />
        </div>
        <div class="config-field">
          <label for="input-api-key">API Key</label>
          <input id="input-api-key" type="text" value="vx_dev_demo" placeholder="vx_dev_..." />
        </div>
      </div>
      <button id="config-apply">Apply</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
